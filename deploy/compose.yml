# Production: Postgres, the API and Caddy on one server. Run from the repository root:
#   docker compose -f deploy/compose.yml up -d --build
# Settings come from deploy/.env (copy deploy/.env.example). Only Caddy is reachable from outside.

name: lifelog

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifelog_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: lifelog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lifelog_owner", "-d", "lifelog"]
      interval: 5s
      retries: 10

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_OWNER_URL: postgres://lifelog_owner:${POSTGRES_PASSWORD}@db:5432/lifelog
      DATABASE_URL: postgres://lifelog_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deploy/.env}@db:5432/lifelog
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in deploy/.env}
      TRUST_PROXY: "1"

  web:
    build: { context: .., target: web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
