services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lifelog_owner
      # Read from the .env file next to this one. It must match the password in DATABASE_OWNER_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, see README}
      POSTGRES_DB: lifelog
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
